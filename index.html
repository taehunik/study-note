                  </button>
                  <div style="flex:1;min-width:0">
                    <div class="todo-title ${t.isCompleted ? "done" : ""}">${escapeHtml(t.title)}</div>
                    ${subj ? `<span class="pill" style="margin-top:4px;background:${subj.color}20;color:${subj.color}">${escapeHtml(subj.name)}</span>` : ""}
                  </div>
                  <button class="btn-text" onclick="startStopwatchForTodo(${t.id})" title="이 할 일로 스톱워치 시작">▶</button>
                  <button class="btn-text btn-danger-text" onclick="deleteTodo(${t.id})" title="삭제">✕</button>
                </div>
              `;
            }).join("");

        return ddayHtml + calendarHtml + swCardHtml + todoHeader + todoListHtml;
      }

      function renderStopwatchScreen() {
        const today = todayIso();
        const selectedSubj = getSubjectById(state.stopwatch.selectedSubjectId);
        const accent = selectedSubj ? selectedSubj.color : "var(--primary)";
        const elapsed = getElapsedMs();
        const hasRecorded = elapsed >= 1000;
        const r = 98;
        const circ = 2 * Math.PI * r;
        const secFrac = (elapsed % 60000) / 60000;
        const dashOffset = circ * (1 - (elapsed > 0 && secFrac === 0 ? 1 : secFrac));

        const subjectChips = state.subjects.length === 0
          ? `<div class="section-sub">과목이 없으면 '일반 공부'로 기록됩니다.</div>`
          : `<div class="chip-row">${state.subjects.map((s) => `
              <button class="chip ${state.stopwatch.selectedSubjectId === s.id ? "selected" : ""}" onclick="selectSwSubject(${s.id})">
                <span class="dot" style="background:${s.color}"></span>
                <span>${escapeHtml(s.name)}</span>
              </button>
            `).join("")}</div>`;

        const todayTodos = getTodosForDate(today);
        const todoChips = todayTodos.length === 0
          ? `<div class="section-sub">오늘 등록된 할 일이 없습니다. 과목만 선택해서 바로 측정할 수 있습니다.</div>`
          : `<div class="chip-row">
              <button class="chip ${state.stopwatch.selectedTodoId == null ? "selected" : ""}" onclick="selectSwTodo(null)">과목 전체</button>
              ${todayTodos.map((t) => `
                <button class="chip ${state.stopwatch.selectedTodoId === t.id ? "selected" : ""}" onclick="selectSwTodo(${state.stopwatch.selectedTodoId === t.id ? "null" : t.id})">
                  ${escapeHtml(t.title)}
                </button>
              `).join("")}
            </div>`;

        const summaries = getSubjectSummariesForDate(today);
        const todayTotal = summaries.reduce((a, s) => a + s.totalSeconds, 0);
        const summaryCards = summaries.length === 0
          ? `<div class="card-muted">아직 저장된 오늘의 공부 기록이 없습니다. 측정 후 저장하면 캘린더와 통계 차트에 자동 반영됩니다.</div>`
          : summaries.map((sum) => `
              <button class="card" style="width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openModal('subjectSessions', '${sum.key}')">
                <div style="display:flex;align-items:center;gap:10px">
                  <span class="dot" style="background:${sum.color}"></span>
                  <div>
                    <div style="font-weight:700;font-size:15px">${escapeHtml(sum.subjectName)}</div>
                    <div class="section-sub">${sum.sessions.length}회 기록 · 눌러서 시간·메모 보기</div>
                  </div>
                </div>
                <strong class="mono" style="color:${sum.color};font-size:15px">${formatDurationKorean(sum.totalSeconds)}</strong>
              </button>
            `).join("");

        return `
          <div class="card">
            <div class="section-header" style="margin-bottom:8px">
              <strong style="font-size:14px">과목 선택</strong>
              <div>
                ${selectedSubj ? `<button class="btn-text" onclick="openModal('editSubject', ${selectedSubj.id})">✎ 이름 수정</button>` : ""}
                <button class="btn-text" onclick="openModal('addSubject')">+ 과목 추가</button>
              </div>
            </div>
            ${subjectChips}
            <div class="section-header" style="margin-top:14px;margin-bottom:8px">
              <strong style="font-size:14px">할 일 연동 (선택)</strong>
              <button class="btn-text" onclick="openModal('addTodo', '${today}')">+ 오늘 할 일</button>
            </div>
            ${todoChips}
          </div>

          <div class="card" style="text-align:center">
            <span class="pill" style="background:${accent}22;color:${accent}">
              ${escapeHtml(selectedSubj ? selectedSubj.name : "일반 공부")} · ${state.stopwatch.isRunning ? "집중 측정 중" : hasRecorded ? "일시정지" : "측정 대기"}
            </span>
            <div class="dial-wrap">
              <svg class="dial-svg" viewBox="0 0 220 220">
                <circle cx="110" cy="110" r="${r}" fill="none" stroke="var(--surface-variant)" stroke-width="12" />
                <circle id="swProgressArc" cx="110" cy="110" r="${r}" fill="none" stroke="${accent}" stroke-width="12"
                  stroke-linecap="round" stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${dashOffset.toFixed(2)}" />
              </svg>
              <div class="dial-center">
                <div id="swReadout" class="dial-time mono">${formatStopwatchMs(elapsed)}</div>
                <div class="section-sub">다른 탭으로 이동해도 유지됩니다</div>
              </div>
            </div>

            <div style="display:flex;gap:10px">
              <button class="btn-outline" style="flex:1" ${elapsed <= 0 && !state.stopwatch.isRunning ? "disabled" : ""} onclick="resetStopwatch()">초기화</button>
              <button class="btn-primary" style="flex:1.7;background:${accent}" onclick="toggleStopwatch()">
                ${state.stopwatch.isRunning ? "⏸ 일시정지" : elapsed > 0 ? "▶ 계속하기" : "▶ 공부 시작"}
              </button>
            </div>

            ${hasRecorded ? `
              <div style="margin-top:14px;text-align:left">
                <label class="field-label">한 줄 메모 (선택)</label>
                <input id="swMemoInput" class="input-field" value="${escapeHtml(swMemoDraft)}" oninput="swMemoDraft=this.value" placeholder="예: 기출 2단원 복습 완료" />
                <button class="btn-secondary w-full" style="margin-top:10px" onclick="saveStopwatchSession()">기록 저장 및 캘린더·차트 자동 반영</button>
              </div>
            ` : ""}
          </div>

          <div class="section-header">
            <div class="section-title">오늘 측정된 기록</div>
            <strong style="color:var(--secondary);font-size:14px">총 ${formatDurationKorean(todayTotal)}</strong>
          </div>
          ${summaryCards}
        `;
      }

      function renderChartsScreen() {
        const today = todayIso();
        const todaySec = getSessionsForDate(today).reduce((a, s) => a + s.durationSeconds, 0);

        // Current week Mon~Sun
        const todayDt = parseIso(today);
        const mondayOffset = (todayDt.getDay() + 6) % 7;
        const mondayIso = addDaysIso(today, -mondayOffset);
        const weekDates = Array.from({ length: 7 }, (_, i) => addDaysIso(mondayIso, i));

        const weeklyBars = weekDates.map((iso, i) => {
          const daySess = getSessionsForDate(iso);
          const total = daySess.reduce((a, s) => a + s.durationSeconds, 0);
          const segMap = new Map();
          daySess.forEach((s) => {
            const key = s.subjectId == null ? "general" : String(s.subjectId);
            const subj = s.subjectId ? getSubjectById(s.subjectId) : null;
            if (!segMap.has(key)) {
              segMap.set(key, { name: subj ? subj.name : "일반 공부", color: subj ? subj.color : "#7B879E", sec: 0 });
            }
            segMap.get(key).sec += s.durationSeconds;
          });
          return { iso, shortDay: DAY_FULL_LABELS[i][0], total, segments: Array.from(segMap.values()) };
        });

        const weeklyTotalSec = weeklyBars.reduce((a, b) => a + b.total, 0);
        const allTimeSec = state.sessions.reduce((a, s) => a + s.durationSeconds, 0);
        const totalTodos = state.todos.length;
        const doneTodos = state.todos.filter((t) => t.isCompleted).length;
        const donePct = totalTodos > 0 ? Math.round((doneTodos / totalTodos) * 100) : 0;

        const kpiHtml = `
          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="section-sub">오늘 공부</div>
              <div style="font-size:15px;font-weight:800;color:var(--primary);margin-top:4px">${formatDurationKorean(todaySec)}</div>
            </div>
            <div class="kpi-card">
              <div class="section-sub">주간 누적</div>
              <div style="font-size:15px;font-weight:800;color:var(--secondary);margin-top:4px">${formatDurationKorean(weeklyTotalSec)}</div>
            </div>
            <div class="kpi-card">
              <div class="section-sub">할 일 달성</div>
              <div style="font-size:15px;font-weight:800;color:var(--tertiary);margin-top:4px">${donePct}%</div>
            </div>
          </div>
        `;

        if (allTimeSec === 0 && totalTodos === 0) {
          return kpiHtml + `
            <div class="card" style="text-align:center;padding:28px 16px">
              <div style="font-weight:700;font-size:16px">아직 기록된 공부 시간이 없습니다</div>
              <div class="section-sub" style="margin:8px 0 16px">스톱워치로 공부를 측정하고 저장하면 캘린더와 차트에 자동으로 시각화됩니다</div>
              <button class="btn-primary" onclick="setTab('stopwatch')">스톱워치로 이동</button>
            </div>
          `;
        }

        // Weekly Stacked Bar Chart
        const maxBarSec = Math.max(60, ...weeklyBars.map((b) => b.total));
        const inspectedBar = weeklyBars.find((b) => b.iso === state.ui.chartInspectedDate) || weeklyBars.find((b) => b.iso === today) || weeklyBars[0];
        const barsHtml = weeklyBars.map((b) => {
          const isInspected = b.iso === inspectedBar.iso;
          const segsHtml = b.segments.map((seg) => {
            const pct = (seg.sec / maxBarSec) * 100;
            return `<div class="bar-seg" style="height:${pct.toFixed(2)}%;background:${seg.color}"></div>`;
          }).join("");
          return `
            <div class="bar-col" onclick="inspectChartDay('${b.iso}')">
              <div class="bar-track">${segsHtml}</div>
              <span class="bar-day-label ${isInspected ? "active" : ""}">${b.shortDay}</span>
            </div>
          `;
        }).join("");

        const inspectedSegsHtml = inspectedBar.segments.length
          ? `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">${inspectedBar.segments.map((seg) => `
              <span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--on-surface-variant)">
                <span class="dot" style="width:8px;height:8px;background:${seg.color}"></span>
                ${escapeHtml(seg.name)} ${formatDurationKorean(seg.sec)}
              </span>
            `).join("")}</div>`
          : "";

        const weeklyCard = `
          <div class="card">
            <div class="section-header">
              <div class="section-title">주간 공부 시간 차트</div>
              <strong style="font-size:13px;color:var(--primary)">${formatKoreanDateFull(inspectedBar.iso)} · ${formatDurationKorean(inspectedBar.total)}</strong>
            </div>
            <div class="bar-chart">${barsHtml}</div>
            ${inspectedSegsHtml}
          </div>
        `;

        // Subject Donut Chart
        const subjectStats = state.subjects.map((s) => {
          const sec = state.sessions.filter((x) => x.subjectId === s.id).reduce((a, b) => a + b.durationSeconds, 0);
          const sTodos = state.todos.filter((t) => t.subjectId === s.id);
          return {
            name: s.name,
            color: s.color,
            sec,
            totalTodos: sTodos.length,
            doneTodos: sTodos.filter((t) => t.isCompleted).length
          };
        });
        const genSec = state.sessions.filter((x) => x.subjectId == null).reduce((a, b) => a + b.durationSeconds, 0);
        if (genSec > 0) {
          const gTodos = state.todos.filter((t) => t.subjectId == null);
          subjectStats.push({
            name: "일반 공부",
            color: "#7B879E",
            sec: genSec,
            totalTodos: gTodos.length,
            doneTodos: gTodos.filter((t) => t.isCompleted).length
          });
        }

        const activeStudySubjects = subjectStats.filter((x) => x.sec > 0);
        let donutBody = `<div class="section-sub">스톱워치로 공부 기록을 저장하면 과목별 비중 차트가 표시됩니다.</div>`;
        if (activeStudySubjects.length > 0 && allTimeSec > 0) {
          const dr = 56;
          const dCirc = 2 * Math.PI * dr;
          let accLen = 0;
          const arcs = activeStudySubjects.map((s) => {
            const frac = s.sec / allTimeSec;
            const len = frac * dCirc;
            const arcHtml = `<circle cx="72" cy="72" r="${dr}" fill="none" stroke="${s.color}" stroke-width="20"
              stroke-dasharray="${len.toFixed(2)} ${(dCirc - len).toFixed(2)}" stroke-dashoffset="${(-accLen).toFixed(2)}" />`;
            accLen += len;
            return arcHtml;
          }).join("");

          const legend = activeStudySubjects.map((s) => `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px">
              <div style="display:flex;align-items:center;gap:7px">
                <span class="dot" style="background:${s.color}"></span>
                <span>${escapeHtml(s.name)}</span>
              </div>
              <strong style="color:${s.color}">${Math.round((s.sec / allTimeSec) * 100)}%</strong>
            </div>
          `).join("");

          donutBody = `
            <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
              <div style="position:relative;width:144px;height:144px;flex-shrink:0">
                <svg viewBox="0 0 144 144" style="width:100%;height:100%;transform:rotate(-90deg)">
                  <circle cx="72" cy="72" r="${dr}" fill="none" stroke="var(--surface-variant)" stroke-width="20" />
                  ${arcs}
                </svg>
                <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
                  <span class="section-sub">총 누적</span>
                  <strong class="mono" style="font-size:13px">${formatDurationKorean(allTimeSec)}</strong>
                </div>
              </div>
              <div style="flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px">${legend}</div>
            </div>
          `;
        }

        const donutCard = `
          <div class="card">
            <div class="section-title" style="margin-bottom:14px">과목별 공부 비중</div>
            ${donutBody}
          </div>
        `;

        const progressCards = subjectStats.map((item) => {
          const pct = item.totalTodos > 0 ? Math.round((item.doneTodos / item.totalTodos) * 100) : 0;
          return `
            <div class="card" style="padding:14px">
              <div class="section-header">
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="dot" style="background:${item.color}"></span>
                  <strong style="font-size:14px">${escapeHtml(item.name)}</strong>
                </div>
                <strong style="color:${item.color};font-size:13px">${formatDurationKorean(item.sec)}</strong>
              </div>
              <div class="section-header" style="margin-top:8px">
                <span class="section-sub">${item.totalTodos > 0 ? `할 일 완료 ${item.doneTodos} / ${item.totalTodos}` : "등록된 할 일 없음"}</span>
                ${item.totalTodos > 0 ? `<span class="section-sub">${pct}%</span>` : ""}
              </div>
              ${item.totalTodos > 0 ? `
                <div class="progress-track" style="margin-top:6px">
                  <div class="progress-fill" style="width:${pct}%;background:${item.color}"></div>
                </div>
              ` : ""}
            </div>
          `;
        }).join("");

        return kpiHtml + weeklyCard + donutCard + `<div class="section-title">과목별 공부 시간 · 할 일 달성 현황</div>` + progressCards;
      }

      function renderAiCoachScreen() {
        const mode = state.ai.subTab === "mock" ? "mock" : "internal";
        const isMock = mode === "mock";
        const maxGrade = isMock ? 9 : 5;
        const cfg = state.ai[mode];

        const subtabsHtml = `
          <div class="subtabs">
            <button class="subtab-btn ${!isMock ? "active" : ""}" onclick="setAiSubTab('internal')">내신 맞춤 커리큘럼 (5등급제)</button>
            <button class="subtab-btn ${isMock ? "active" : ""}" onclick="setAiSubTab('mock')">모의고사 맞춤 커리큘럼 (9등급제)</button>
          </div>
        `;

        const gradeOptions = (selected) => {
          let opts = `<option value="">미입력</option>`;
          for (let g = 1; g <= maxGrade; g++) {
            opts += `<option value="${g}" ${selected === g ? "selected" : ""}>${g}등급</option>`;
          }
          return opts;
        };

        const subjectsHtml = state.subjects.length === 0
          ? `<div class="card-muted" style="text-align:center">등록된 과목이 없습니다. 과목을 추가하고 등급을 선택해 주세요.</div>`
          : state.subjects.map((s) => {
              const cur = isMock ? s.mockCurrentGrade : s.currentGrade;
              const tgt = isMock ? s.mockTargetGrade : s.targetGrade;
              return `
                <div class="grade-row">
                  <button style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px" onclick="openModal('editSubject', ${s.id})">
                    <span class="dot" style="background:${s.color}"></span>
                    <span>${escapeHtml(s.name)}</span>
                    <span style="font-size:12px;color:var(--on-surface-variant)">✎</span>
                  </button>
                  <div class="grade-selects">
                    <label style="font-size:11px;color:var(--on-surface-variant)">현재</label>
                    <select class="grade-select" onchange="updateSubjectGrade(${s.id}, '${mode}', 'current', this.value)">
                      ${gradeOptions(cur)}
                    </select>
                    <label style="font-size:11px;color:var(--on-surface-variant)">목표</label>
                    <select class="grade-select" style="color:${s.color};border-color:${s.color}66" onchange="updateSubjectGrade(${s.id}, '${mode}', 'target', this.value)">
                      ${gradeOptions(tgt)}
                    </select>
                  </div>
                </div>
              `;
            }).join("");

        const totalHours = cfg.dailyHours.reduce((a, v) => a + Math.min(24, Math.max(0, parseFloat(v) || 0)), 0);
        const dayInputsHtml = DAY_FULL_LABELS.map((label, idx) => `
          <div class="daily-input-box">
            <label for="dayHour_${mode}_${idx}">${label}</label>
            <div style="display:flex;align-items:center;gap:4px">
              <input id="dayHour_${mode}_${idx}" class="mono" inputmode="decimal" value="${escapeHtml(cfg.dailyHours[idx])}"
                oninput="updateDailyHour('${mode}', ${idx}, this.value)" placeholder="0" />
              <span style="font-size:12px;color:var(--on-surface-variant)">시간</span>
            </div>
          </div>
        `).join("");

        const presetHtml = PRESETS.map((p, pIdx) => {
          const isMatch = JSON.stringify(cfg.dailyHours) === JSON.stringify(p.vals);
          return `<button class="preset-btn ${isMatch ? "active" : ""}" onclick="applyHourPreset('${mode}', ${pIdx})">${p.label}</button>`;
        }).join("");

        const inputCard = `
          <div class="card">
            <div class="section-header" style="margin-bottom:12px">
              <div>
                <div class="section-title">${isMock ? "과목별 모의고사 등급 입력 (9등급제)" : "과목별 내신 등급 입력 (5등급제)"}</div>
                <div class="section-sub">${isMock ? "9등급제(1~9등급) 기준으로 현재·목표 등급을 선택하세요" : "5등급제(1~5등급) 기준으로 현재·목표 등급을 선택하세요"}</div>
              </div>
              <button class="btn-text" onclick="openModal('addSubject')">+ 과목 추가</button>
            </div>

            <div style="display:flex;flex-direction:column;gap:8px">${subjectsHtml}</div>

            <div class="section-header" style="margin-top:16px;margin-bottom:8px">
              <div>
                <strong style="font-size:14px">요일별 목표 공부 시간</strong>
                <div class="section-sub">소수점 입력 가능 (예: 1.5시간, 휴식일은 0)</div>
              </div>
              <strong id="aiWeeklyBadge" style="font-size:12px;color:var(--primary)">
                ${totalHours > 0 ? `주간 ${formatDurationKorean(Math.round(totalHours * 3600))}` : "시간 입력 필요"}
              </strong>
            </div>

            <div class="daily-hours-grid">
              ${dayInputsHtml}
              <div class="weekly-total-tile">
                <span style="font-size:11px;font-weight:600">주간 총 목표</span>
                <strong id="aiWeeklyTotalLabel" class="mono" style="font-size:16px;color:var(--primary)">${totalHours.toFixed(1)}시간</strong>
              </div>
            </div>

            <div class="preset-row">${presetHtml}</div>

            <div style="margin-top:12px">
              <label class="field-label">학습 목표 메모 (선택)</label>
              <input class="input-field" value="${escapeHtml(cfg.goalNote)}" oninput="updateGoalNote('${mode}', this.value)"
                placeholder="${isMock ? "예: 6월 모평 대비, 국어·수학 2등급 진입 목표" : "예: 수요일 학원 때문에 시간 적음, 수학 2등급 목표"}" />
            </div>

            <button id="aiGenerateBtn" class="btn-primary w-full" style="margin-top:14px"
              ${cfg.loading || state.subjects.length === 0 || totalHours <= 0 ? "disabled" : ""}
              onclick="generateCurriculum('${mode}')">
              ✨ ${cfg.loading
                ? (isMock ? "모의고사 요일별 커리큘럼 설계 중..." : "내신 요일별 커리큘럼 설계 중...")
                : (isMock ? "모의고사 요일별 맞춤 커리큘럼 생성" : "내신 요일별 맞춤 커리큘럼 생성")}
            </button>
          </div>
        `;

        let resultHtml = "";
        if (cfg.error) {
          resultHtml += `<div class="card" style="background:var(--error-bg);border-color:var(--error);color:var(--error);font-size:13px">${escapeHtml(cfg.error)}</div>`;
        }

        if (!cfg.result) {
          resultHtml += `
            <div class="card-muted">
              ${isMock
                ? "과목별 모의고사 등급(1~9등급)과 월요일~일요일 공부 가능 시간을 입력하면, 모의고사·수능 대비 과목별 비중(%)과 요일별 맞춤 시간표를 설계해 줍니다."
                : "과목별 내신 등급(1~5등급)과 월요일~일요일 공부 가능 시간을 입력하면, 과목별 비중(%)과 요일별 맞춤 시간표를 설계해 줍니다."}
            </div>
          `;
        } else {
          const r = cfg.result;
          const totalPct = r.allocations.reduce((a, x) => a + x.recommendedPercent, 0) || 1;
          const barSegs = r.allocations.map((a, idx) => {
            const subj = state.subjects.find((s) => s.name === a.subjectName);
            const col = subj ? subj.color : SUBJECT_PALETTE[idx % SUBJECT_PALETTE.length];
            return `<div style="width:${(a.recommendedPercent / totalPct) * 100}%;background:${col}"></div>`;
          }).join("");

          const dailyCards = (r.dailySchedule || []).map((day) => {
            const slotsHtml = (day.slots || []).map((slot, sIdx) => {
              const subj = state.subjects.find((s) => s.name === slot.subjectName);
              const col = subj ? subj.color : SUBJECT_PALETTE[sIdx % SUBJECT_PALETTE.length];
              return `
                <span class="pill" style="background:${col}1F;color:${col};border:1px solid ${col}55">
                  <span class="dot" style="width:6px;height:6px;background:${col}"></span>
                  ${escapeHtml(slot.subjectName)} ${Number(slot.hours).toFixed(1)}h
                </span>
              `;
            }).join("");
            return `
              <div class="card-muted" style="padding:12px">
                <div class="section-header">
                  <strong style="color:var(--on-surface);font-size:14px">${escapeHtml(day.dayOfWeek)}</strong>
                  <span class="pill" style="background:${day.targetHours > 0 ? "var(--primary-container)" : "var(--surface)"};color:${day.targetHours > 0 ? "var(--on-primary-container)" : "var(--on-surface-variant)"}">
                    ${day.targetHours > 0 ? `${Number(day.targetHours).toFixed(1)}시간` : "휴식"}
                  </span>
                </div>
                ${slotsHtml ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${slotsHtml}</div>` : ""}
                ${day.note ? `<div style="font-size:12px;margin-top:6px">${escapeHtml(day.note)}</div>` : ""}
              </div>
            `;
          }).join("");

          const allocCards = r.allocations.map((a, idx) => {
            const subj = state.subjects.find((s) => s.name === a.subjectName);
            const col = subj ? subj.color : SUBJECT_PALETTE[idx % SUBJECT_PALETTE.length];
            return `
              <div class="card" style="padding:14px">
                <div class="section-header">
                  <div style="display:flex;align-items:center;gap:8px">
                    <span class="dot" style="background:${col}"></span>
                    <strong style="font-size:15px">${escapeHtml(a.subjectName)}</strong>
                    <span class="section-sub">${a.currentGrade}→${a.targetGrade}등급</span>
                  </div>
                  <span class="pill" style="background:${col}22;color:${col}">${a.recommendedPercent}% · 주 ${Number(a.weeklyHours).toFixed(1)}시간</span>
                </div>
                <div style="font-size:13px;color:var(--on-surface-variant);margin-top:8px">${escapeHtml(a.focusStrategy)}</div>
                ${a.sampleTodoTitle ? `
                  <button class="btn-tonal" style="margin-top:10px" onclick="addRecommendedTodoByIdx('${mode}', ${idx})">
                    + 오늘 할 일 추가: ${escapeHtml(a.sampleTodoTitle)}
                  </button>
                ` : ""}
              </div>
            `;
          }).join("");

          const tipsHtml = (r.weeklyTips || []).length ? `
            <div class="card" style="background:var(--primary-container);color:var(--on-primary-container);border:none">
              <strong style="font-size:14px">주간 커리큘럼 운영 팁</strong>
              <ul style="margin:8px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:5px">
                ${r.weeklyTips.map((t) => `<li>${escapeHtml(t)}</li>`).join("")}
              </ul>
            </div>
          ` : "";

          resultHtml += `
            <div class="card">
              <div class="section-title" style="margin-bottom:10px">추천 공부시간 비중</div>
              <div class="proportion-bar">${barSegs}</div>
              <div style="font-size:14px;margin-top:12px">${escapeHtml(r.overallStrategy)}</div>
            </div>
            <div class="card" style="display:flex;flex-direction:column;gap:8px">
              <div class="section-title">요일별 맞춤 커리큘럼</div>
              ${dailyCards}
            </div>
            ${allocCards}
            ${tipsHtml}
          `;
        }

        return subtabsHtml + inputCard + resultHtml;
      }

      function render() {
        applyTheme();
        const tab = state.ui.tab;
        const titles = {
          calendar: "스터디노트",
          stopwatch: "집중 스톱워치",
          charts: "학습 통계 차트",
          ai: "AI 학습 코치"
        };
        document.getElementById("topBarTitle").textContent = titles[tab] || "스터디노트";
        document.querySelectorAll("[data-tab]").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.tab === tab);
        });

        let body = renderLiveBanner();
        if (tab === "calendar") body += renderCalendarScreen();
        else if (tab === "stopwatch") body += renderStopwatchScreen();
        else if (tab === "charts") body += renderChartsScreen();
        else if (tab === "ai") body += renderAiCoachScreen();

        document.getElementById("appContent").innerHTML = body;
        syncTicker();
      }

      render();
    })();
  </script>
</body>
</html>
